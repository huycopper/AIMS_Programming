<div class="cart-container container mx-auto p-4">
  <a routerLink="/" class="text-blue-600 hover:underline mb-4 inline-block">&larr; Continue Shopping</a>
  <h1 class="text-2xl font-bold mb-4">Shopping Cart</h1>

  <div *ngIf="!cart || cart.items.length === 0" class="empty-cart text-center p-8 bg-gray-50 rounded-lg">
    <p class="text-lg text-gray-500">Your cart is empty</p>
  </div>

  <div *ngIf="cart && cart.items.length > 0" class="cart-content flex flex-col md:flex-row gap-6">
    <div class="cart-items flex-1">
      <div *ngFor="let item of cart.items" class="cart-item flex items-center p-4 border-b">
        <div class="item-details flex-1">
          <h3 class="font-semibold">{{ item.product.title }}</h3>
          <p class="text-sm text-gray-500">Price: {{ formatPrice(item.product.currentPrice) }}</p>
          <div *ngIf="insufficientStockItem[item.product.productId]" class="error-banner text-red-500 text-sm mt-1">
            Only {{ insufficientStockItem[item.product.productId] }} items left in stock
          </div>
        </div>
        
        <div class="item-actions flex items-center gap-4">
          <div class="quantity-control flex items-center border rounded">
            <input type="number" 
                   [ngModel]="item.quantity" 
                   (ngModelChange)="handleQuantityChange(item.product.productId, $event, item.product.stockQuantity)"
                   min="1" 
                   [max]="item.product.stockQuantity"
                   class="w-16 text-center p-1">
          </div>
          <button (click)="removeItem(item.product.productId)" class="text-red-500 hover:text-red-700">Remove</button>
        </div>
      </div>
    </div>

    <div class="cart-summary w-full md:w-80 bg-gray-50 p-6 rounded-lg h-fit">
      <h2 class="text-xl font-bold mb-4">Order Summary</h2>
      <div class="summary-row flex justify-between mb-4">
        <span>Subtotal:</span>
        <span class="font-semibold">{{ formatPrice(totalExclVAT) }}</span>
      </div>
      <button (click)="askToPlaceOrder()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
        Place Order
      </button>
    </div>
  </div>
</div>
