<div class="payment-container">
  <h2>VietQR Payment</h2>

  <!-- Trạng thái: Đang tạo mã QR -->
  <div *ngIf="loading" class="spinner-container">
    <div class="spinner"></div>
    <p>Generating QR Code...</p>
  </div>

  <!-- Trạng thái: Lỗi (không có orderId hoặc API thất bại) -->
  <div *ngIf="errorMessage" class="error-container">
    <p class="error-text">{{ errorMessage }}</p>
    <button (click)="goHome()" class="btn-home">Return to Home Page</button>
  </div>

  <!-- Trạng thái: Hiển thị mã QR -->
  <div *ngIf="!loading && !paymentSuccess && !errorMessage" class="qr-container">
    <p>Scan the QR code below with your banking app to pay.</p>

    <div *ngIf="amount" class="amount-display">
      <h3>
        Total Amount:
        <span class="highlight-amount">{{ amount | currency: 'VND' : 'symbol' : '1.0-0' }}</span>
      </h3>
    </div>

    <!-- Hiển thị ảnh QR -->
    <img *ngIf="qrDataURL" [src]="safeQrUrl" class="qr-image" alt="VietQR Code" />

    <div class="sandbox-controls">
      <button (click)="simulateCallback()" class="btn-simulate">I have paid</button>
    </div>
  </div>

  <!-- Trạng thái: Thanh toán thành công -->
  <div *ngIf="paymentSuccess" class="success-container">
    <h3>Payment Successful!</h3>
    <p>Your order is now processing.</p>
  </div>
</div>
