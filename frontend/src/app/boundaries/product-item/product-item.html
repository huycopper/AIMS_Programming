<article
  class="product-card"
  [id]="'product-' + product.productId"
  role="button"
  tabindex="0"
  (click)="openProductDetail()"
  (keyup.enter)="openProductDetail()"
>
  <div [class]="'card-image-area bg-' + product.productType.toLowerCase()">
    <span class="type-badge" [class]="'type-badge ' + getTypeBadgeClass()">
      {{ product.productType }}
    </span>
    <div class="product-icon">
      @switch (product.productType) {
        @case ('BOOK') {
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
          </svg>
        }
        @case ('CD') {
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
        @case ('DVD') {
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
        }
        @case ('NEWSPAPER') {
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
          </svg>
        }
      }
    </div>
  </div>

  <div class="card-body">
    <h3 class="product-title" [title]="product.title">
      {{ product.title }}
    </h3>

    <div class="product-purchase">
      <div class="price-stock">
        <span class="product-price">
          {{ formatPrice(product.currentPrice) }}
        </span>
        <span class="stock-info" [class.out-of-stock]="product.stockQuantity === 0">
          @if (product.stockQuantity > 0) {
            In Stock ({{ product.stockQuantity }})
          } @else {
            Out of Stock
          }
        </span>
      </div>
    </div>
  </div>
</article>
