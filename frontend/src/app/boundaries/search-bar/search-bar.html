<aside class="search-sidebar" id="search-sidebar">
  <div class="filter-section">
    <h3 class="filter-title">Search</h3>
    <div class="search-input-group">
      <input
        type="text"
        id="search-input"
        class="search-input"
        [(ngModel)]="searchQuery"
        placeholder="Search by title or category"
        maxlength="200"
        (keyup.enter)="onSearch()"
      />
      <button
        id="search-button"
        class="search-button"
        (click)="onSearch()"
        aria-label="Search products"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="filter-section">
    <h3 class="filter-title">Price Range (VND)</h3>
    <div class="price-bucket-list">
      @for (bucket of priceBuckets; track bucket.value) {
        <label class="price-bucket" [for]="'price-' + bucket.value">
          <input
            type="radio"
            name="priceBucket"
            [id]="'price-' + bucket.value"
            [value]="bucket.value"
            [(ngModel)]="selectedPriceBucket"
            (change)="onPriceBucketChange()"
          />
          <span>{{ bucket.label }}</span>
        </label>
      }
    </div>

    <div class="price-range-group">
      <input
        type="number"
        id="price-min"
        class="price-input"
        [(ngModel)]="minPrice"
        placeholder="Min"
        min="0"
        maxlength="10"
        (keyup.enter)="onApplyPriceFilter()"
      />
      <span class="price-separator">-</span>
      <input
        type="number"
        id="price-max"
        class="price-input"
        [(ngModel)]="maxPrice"
        placeholder="Max"
        min="0"
        maxlength="10"
        (keyup.enter)="onApplyPriceFilter()"
      />
    </div>
  </div>

  <button
    id="clear-filters"
    class="clear-button"
    (click)="onClearFilters()"
  >
    Clear All Filters
  </button>
</aside>
